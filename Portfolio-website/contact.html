<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <!-- For importing icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Contact Us</title>
  </head>
  <body>
    <!-- Navigation bar -->
    <header class="bg-gray-100 shadow-lg">
      <div class="container mx-auto p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-yellow-500">Hammad's Portfolio</h1>
        <nav>
          <ul class="flex space-x-6 text-gray-800">
            <li>
              <a href="home.html" class="hover:text-gray-600"
                >Personal Profile</a
              >
            </li>
            <li>
              <a href="projects.html" class="hover:text-gray-600">Projects</a>
            </li>
            <li>
              <a href="career.html" class="hover:text-gray-600">Career Goals</a>
            </li>
            <li>
              <a href="gallery.html" class="hover:text-gray-600"
                >Gallery Page</a
              >
            </li>
            <li>
              <a href="skills.html" class="hover:text-gray-600"
                >Skills & Interests</a
              >
            </li>
            <li>
              <a href="contact.html" class="hover:text-gray-600">Contact Us</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Contact Us Page -->
    <section class="py-20 bg-gray-100" id="contact-us">
      <div class="container mx-auto px-4">
        <!-- Page Header -->
        <div
          class="text-center mb-12 rounded-full bg-gray-800 p-6 mx-auto max-w-lg"
        >
          <h1 class="text-4xl font-bold text-white">Contact Us</h1>
        </div>

        <!-- Contact Form -->
        <div class="bg-white rounded-lg shadow-lg p-8 mb-12">
          <h2 class="text-3xl font-semibold text-gray-800 mb-6">
            Get in Touch
          </h2>
          <form
            action="mailto:hammadidrres454@gmail.com"
            method="post"
            enctype="text/plain"
          >
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <!-- Name Field -->
              <div>
                <label
                  for="name"
                  class="block text-gray-700 text-sm font-medium mb-2"
                  >Name</label
                >
                <input
                  type="text"
                  id="name"
                  name="name"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition duration-200"
                />
              </div>
              <!-- Email Field -->
              <div>
                <label
                  for="email"
                  class="block text-gray-700 text-sm font-medium mb-2"
                  >Email</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition duration-200"
                />
              </div>
            </div>
            <!-- Subject Field -->
            <div class="mb-6">
              <label
                for="subject"
                class="block text-gray-700 text-sm font-medium mb-2"
                >Subject</label
              >
              <input
                type="text"
                id="subject"
                name="subject"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition duration-200"
              />
            </div>
            <!-- Message Field -->
            <div class="mb-6">
              <label
                for="message"
                class="block text-gray-700 text-sm font-medium mb-2"
                >Message</label
              >
              <textarea
                id="message"
                name="message"
                rows="4"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition duration-200"
              ></textarea>
            </div>
            <!-- Submit Button -->
            <button
              type="submit"
              class="bg-gray-800 text-white px-6 py-3 rounded-lg hover:bg-gray-700 shadow-md transform hover:scale-105 transition duration-200"
            >
              Send Message
            </button>
          </form>
        </div>

        <!-- Contact Information -->
        <div class="bg-white rounded-lg shadow-lg p-8">
          <h2 class="text-3xl font-semibold text-gray-800 mb-6">
            Contact Details
          </h2>
          <div class="flex items-center mb-4">
            <i class="fas fa-envelope text-gray-600 mr-4"></i>
            <div>
              <h3 class="text-xl font-semibold text-gray-800 mb-1">Email</h3>
              <p class="text-gray-700">
                <a
                  href="mailto:hammadidrres454@gmail.com"
                  class="text-yellow-500 hover:underline"
                >
                  hammadidrres454@gmail.com
                </a>
              </p>
            </div>
          </div>
          <div class="flex items-center mb-4">
            <i class="fas fa-phone-alt text-gray-600 mr-4"></i>
            <div>
              <h3 class="text-xl font-semibold text-gray-800 mb-1">Phone</h3>
              <p class="text-gray-700">0320-5412871</p>
            </div>
          </div>
          <div class="flex items-center">
            <i class="fas fa-map-marker-alt text-gray-600 mr-4"></i>
            <div>
              <h3 class="text-xl font-semibold text-gray-800 mb-1">Address</h3>
              <p class="text-gray-700">New Sharqi colony, Vehari</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
